<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Poker Night - Tournament & Cash Game Manager">
  <!-- `maximum-scale=1.0, user-scalable=no` used to be here. It blocks pinch
       zoom, so whenever anything rendered small the user had no way to
       compensate — and it fails WCAG 1.4.4 (resize text). Removed: the app is
       laid out responsively, so it does not need zoom suppressed to look
       right, and a live tournament is exactly the situation where someone
       wants to zoom in on the blinds. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="application-name" content="Poker Night">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Poker Night">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png">

  <!-- Android -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png">

  <title>Poker Night</title>
  <!-- G1: start the engine download in parallel with main.dart.js instead of
       after it. Same origin (see flutter_bootstrap.js), so no third party. -->
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="manifest" href="manifest.json">

  <!-- OneSignal Web Push (free-plan push — no Cloud Functions).
       The Dart side drives this SDK through js interop
       (lib/services/push/platform_push_web.dart). -->
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
  </script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <!-- The page has nothing in it until Flutter paints its first frame, and
       main() has several awaits (Firebase, App Check, Google Sign-In, device
       id, push) before runApp(). A bare body renders that window as a WHITE
       screen, which reads as a crash.

       This paints the same colour the app itself starts on: AppColors.background
       for the default palette, ThemePalettes.red -> Color(0xFF0A0A0A), which is
       the client's declared "ground" token. Every other palette's background is
       within a few levels of it too (0x000000, 0x050505, 0x080600, 0x030712,
       0x080300), so this is correct whatever theme the user has cached.

       Keep this value and theme-color in step with ThemePalettes.red.background
       — if they drift, the handoff from this layer to the first Flutter frame
       shows as a flash of the wrong black. -->
  <!--

       Deliberately NO spinner here. SplashScreen is the app's loading state and
       it fades its card up from opacity 0 on this exact colour, so the handoff
       is invisible and the user sees one continuous load. A spinner in this
       layer would show first and then be replaced by the splash, which reads as
       two loaders for one launch. -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0A0A0A;
    }
  #pn-boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: #0A0A0A; z-index: 1;
      font: 700 28px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: -0.5px; color: #fff; transition: opacity .25s ease;
    }
    #pn-boot b { color: #E5484D; font-weight: 700; }
    #pn-boot.pn-done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!-- G1: painted by the HTML itself, before any script runs. Removed on
       Flutter's first frame; the app's SplashScreen takes over on the same
       colour. -->
  <div id="pn-boot" aria-hidden="true">pokernight<b>tools</b></div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var el = document.getElementById("pn-boot");
      if (!el) return;
      el.classList.add("pn-done");
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
