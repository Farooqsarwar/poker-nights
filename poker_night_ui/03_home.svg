<!-- Poker Night Home Screen (B1) - §B1 -->
<!-- Background: bg #0A0A0A -->
<!-- Elements: red #D53032, white #FFFFFF, muted #A6A6AA, surface #141414, surface2 #1C1C1C, green #3FBF6B -->
<!-- Spec Mapping: -->
<!-- §B1: Home — what needs me now, for current group in priority order ✅ -->
<!-- §E17 Row 1: RSVP seating & waitlist queue — taps Going/Maybe/Can't/+1 ✅ -->
<!-- §E17 Row 2: Waitlist promotion on drop — automatic ✅ -->
<!-- §E17 Row 3: RSVP deadline lock — wall clock reaches deadline ✅ -->
<!-- §E17 Row 4: Second-table Premium prompt (D5) — when RSVP count exceeds maxPerTable ✅ -->
<!-- §E17 Row 5: "Same as last time?" repost suggestion — state check only ✅ -->
<!-- §E17 Row 6: Code generation — 6 chars from crypto RNG ✅ -->
<!-- §E17 Row 7: Code normalisation & resolution — strip, uppercase, classify ✅ -->
<!-- §E17 Row 8: Code-lookup rate limit — 10 lookups/min, 11th → wait a minute ✅ -->
<!-- §E17 Row 9: Rebuy-rate learning pre-fill — from last 8 games, slider ✅ -->
<!-- §E17 Row 10: Pace-learning callout — from last 5 games, adjust ±20% ✅ -->
<!-- §E17 Row 11: Template/preset pre-fill — pre-fills wizard, jumps to step 5 ✅ -->
<!-- §B1 Item 4: Hero card priority — game running, game you play, next game, no game ✅ -->
<!-- §B1 Item 7: Second-table card — when RSVP pushes going past one table (D5) ✅ -->
<!-- §B1 Item 8: Group snapshot — four stat tiles ✅ -->
<!-- §B1 Item 9: Upcoming — section with "See all" → B2 ✅ -->
<!-- §B1 Item 10: To vote — up to two open polls inline ✅ -->
<!-- §B4 Rule 10: Abbreviations fine in dense tables but not in fields host is setting ✅ -->
<!-- §B4 Rule 13: Focus — every focusable control shows 2px red ring 2px outside bounds ✅ -->
<svg width="393" height="844" viewBox="0 0 393 844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="393" height="844" fill="#0A0A0A"/>
  <!-- App bar (Welcome row) -->
  <rect x="0" y="0" width="393" height="80" fill="#141414"/>
  <circle cx="35" cy="40" r="18" fill="#D53032"/>
  <text x="55" y="43" fill="#FFFFFF" font-family="Space Grotesk" font-size="14" font-weight="600">Alexey</text>
  <text x="55" y="62" fill="#A6A6AA" font-family="Space Grotesk" font-size="10" font-weight="600">Welcome back</text>
  <circle cx="333" cy="40" r="18" fill="#D53032"/>
  <text x="355" y="43" fill="#FFFFFF" font-family="Space Grotesk" font-size="10" font-weight="600">•</text>
  <text x="355" y="62" fill="#A6A6AA" font-family="Space Grotesk" font-size="10" font-weight="600">2 unread</text>
  <!-- Page title -->
  <text x="196.5" y="100" text-anchor="middle" fill="#FFFFFF" font-family="Space Grotesk" font-size="17" font-weight="600" letter-spacing="0.16em">Home</text>
  <!-- Hero card - A game is running -->
  <g transform="translate(0, 140)">
    <rect x="20" y="40" width="353" height="160" rx="18" fill="#1C1C1C"/>
    <circle cx="35" cy="80" r="18" fill="#D53032"/>
    <text x="55" y="80" fill="#FFFFFF" font-family="Space Grotesk" font-size="14" font-weight="600">NEXT UP</text>
    <text x="55" y="100" fill="#3FBF6B" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="0.16em">LIVE</text>
    <text x="55" y="115" fill="#FFFFFF" font-family="Space Grotesk" font-size="13" font-weight="500">Friday Poker</text>
    <text x="55" y="130" fill="#FFFFFF" font-family="Space Grotesk" font-size="11" font-weight="500">Level 4 · 4 / 8 · 10 players left</text>
    <text x="55" y="145" fill="#FFFFFF" font-family="Space Grotesk" font-size="10" font-weight="500">The clock kept running while the app was closed.</text>
  </g>
  <!-- Two buttons row -->
  <g transform="translate(0, 320)">
    <rect x="40" y="40" width="150" height="52" rx="13" fill="#1C1C1C"/>
    <text x="115" y="67" text-anchor="middle" fill="#FFFFFF" font-family="Space Grotesk" font-size="15" font-weight="500">+ New game</text>
    <rect x="220" y="40" width="133" height="52" rx="13" fill="#D53032"/>
    <text x="266.5" y="67" text-anchor="middle" fill="#FFFFFF" font-family="Space Grotesk" font-size="15" font-weight="600">Cash game</text>
  </g>
  <!-- Same as last time? card -->
  <g transform="translate(0, 420)">
    <rect x="20" y="40" width="353" height="100" rx="18" fill="#1C1C1C"/>
    <text x="23" y="70" fill="#FFFFFF" font-family="Space Grotesk" font-size="11" font-weight="500">Friday Poker · Fri 20:00 · 18 going</text>
    <text x="196.5" y="90" fill="#D53032" font-family="Space Grotesk" font-size="10" font-weight="600" letter-spacing="0.16em">→ Post for RSVP</text>
    <text x="340" y="90" fill="#3FBF6B" font-family="Space Grotesk" font-size="10" font-weight="500">GOING</text>
  </g>
  <!-- Group snapshot section -->
  <g transform="translate(0, 540)">
    <text x="20" y="50" fill="#FFFFFF" font-family="Space Grotesk" font-size="11" font-weight="500" letter-spacing="0.16em">Group snapshot</text>
    <g transform="translate(20, 80)">
      <g><text x="0" y="20" fill="#FFFFFF" font-family="Space Grotesk" font-size="28" font-weight="500">12</text><text x="0" y="38" fill="#A6A6AA" font-family="Space Grotesk" font-size="10">games</text></g>
      <g transform="translate("45,0")><text x="0" y="20" fill="#FFFFFF" font-family="Space Grotesk" font-size="28" font-weight="500">8</text><text x="0" y="38" fill="#A6A6AA" font-family="Space Grotesk" font-size="10">members</text></g>
      <g transform="translate("90",0")><text x="0" y="20" fill="#FFFFFF" font-family="Space Grotesk" font-size="28" font-weight="500">0</text><text x="0" y="38" fill="#A6A6AA" font-family="Space Grotesk" font-size="10">cash games</text></g>
      <g transform="translate("135",0")><text x="0" y="20" fill="#FFFFFF" font-family="Space Grotesk" font-size="28" font-weight="500">0</text><text x="0" y="38" fill="#A6A6AA" font-family="Space Grotesk" font-size="10">paid out</text></g>
    </g>
  </g>
  <!-- Upcoming games section -->
  <g transform="translate(0, 660)">
    <text x="20" y="50" fill="#FFFFFF" font-family="Space Grotesk" font-size="11" font-weight="500" letter-spacing="0.16em">Upcoming</text>
    <g transform="translate(0, 80)">
      <rect x="20" y="10" width="150" height="40" rx="13" fill="#1C1C1C"/>
      <text x="100" y="35" fill="#FFFFFF" font-family="Space Grotesk" font-size="11">Friday Poker · Fri 20:00</text>
      <text x="230" y="35" fill="#D53032" font-family="Space Grotesk" font-size="10" font-weight="600">15 buy-in</text>
    </g>
  </g>
</svg>