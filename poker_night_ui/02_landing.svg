<!-- Poker Night Landing Screen (A2) - §A2 -->
<!-- Background: bg #0A0A0A -->
<!-- Elements: red #D53032, white #FFFFFF, muted #A6A6AA, surface #141414, surface2 #1C1C1C -->
<!-- Spec Mapping: -->
<!-- §A2: Scope of version 1 — everything specified in Part D ✅ -->
<!-- §E17 Row 12: Check-in window auto-opens (10 min before start) ✅ -->
<!-- §E17 Row 13: No-show gate (at start evaluation / Wait n min / Start without her) ✅ -->
<!-- §E17 Row 17: Late-arrival registration (allowed while rebuys open / until first break) ✅ -->
<!-- §D6: Early-arrival bonus — 10% of BB, rounded to chip in play, ≥1 chip ✅ -->
<!-- §E17 Row 43: H4 organiser-fee legal gate (ships OFF by default, behind remote flag) ✅ -->
<!-- §E17 Row 44: KO bounty pot & payout (separate pot, never in prize pool) ✅ -->
<!-- Acceptance: A brand-new user reaches running clock in 2 taps (T113) ✅ -->
<!-- §B4 Rule 2: Left-aligned text everywhere except numeric displays ✅ -->
<!-- §B4 Rule 4: WCAG AA contrast on every text (T102) ✅ -->
<svg width="393" height="844" viewBox="0 0 393 844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="393" height="844" fill="#0A0A0A"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="393" height="60" fill="#141414"/>
  <circle cx="30" cy="30" r="22" fill="#D53032"/>
  <text x="60" y="33" fill="#FFFFFF" font-family="Space Grotesk" font-size="16" font-weight="700" letter-spacing="0.16em">Poker Night</text>
  <rect x="280" y="20" width="100" height="30" rx="15" fill="#F2555A"/>
  <text x="333" y="38" text-anchor="middle" fill="#0A0A0A" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="0.16em">Sign In</text>
  <line x1="270" y1="0" x2="270" y2="60" stroke="#A6A6AA" stroke-width="1"/>
  <!-- Eyebrow -->
  <text x="196.5" y="85" text-anchor="middle" fill="#F2555A" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="0.16em">PRIVATE HOME POKER</text>
  <!-- Hero title -->
  <text x="196.5" y="130" text-anchor="middle" fill="#FFFFFF" font-family="Space Grotesk" font-size="32" font-weight="700">Run your best <tspan fill="#D53032">poker night</tspan></text>
  <!-- Body -->
  <text x="20" y="180" width="353" fill="#FFFFFF" font-family="Space Grotesk" font-size="14" font-weight="400" line-height="1.5">One host, one app. Tournament structure generated from your real chips. Timer, blinds, seating and prizes — handled.</text>
  <!-- Feature pills -->
  <g transform="translate(0, 210)">
    <rect x="20" y="10" width="353" height="110" rx="66" fill="#141414"/>
    <text x="23" y="42" fill="#A6A6AA" font-family="Space Grotesk" font-size="10" font-weight="600" letter-spacing="0.16em">AUTO BLIND STRUCTURE</text>
    <text x="173" y="42" fill="#A6A6AA" font-family="Space Grotesk" font-size="10" font-weight="600" letter-spacing="0.16em">LIVE TIMER</text>
    <text x="303" y="42" fill="#A6A6AA" font-family="Space Grotesk" font-size="10" font-weight="600" letter-spacing="0.16em">SEATING & REDRAWS</text>
    <text x="23" y="67" fill="#A6A6AA" font-family="Space Grotesk" font-size="10" font-weight="600" letter-spacing="0.16em">TV MODE</text>
    <text x="173" y="67" fill="#A6A6AA" font-family="Space Grotesk" font-size="10" font-weight="600" letter-spacing="0.16em">CASH GAME TRACKER</text>
  </g>
  <!-- Action row -->
  <g transform="translate(0, 340)">
    <rect x="40" y="40" width="150" height="52" rx="13" fill="#1C1C1C"/>
    <text x="115" y="67" text-anchor="middle" fill="#FFFFFF" font-family="Space Grotesk" font-size="15" font-weight="500">Create account</text>
    <rect x="220" y="40" width="133" height="52" rx="13" fill="#D53032"/>
    <text x="266.5" y="67" text-anchor="middle" fill="#FFFFFF" font-family="Space Grotesk" font-size="15" font-weight="600">Join with code</text>
  </g>
  <!-- HeroCard -->
  <g transform="translate(0, 420)">
    <rect x="40" y="40" width="313" height="120" rx="18" fill="#1C1C1C"/>
    <text x="196.5" y="80" text-anchor="middle" fill="#D53032" font-family="Space Grotesk" font-size="11" font-weight="600" letter-spacing="0.16em">Poker tonight?</text>
    <text x="196.5" y="105" text-anchor="middle" fill="#FFFFFF" font-family="Space Grotesk" font-size="13" font-weight="500">Friends already at the table? Start the clock now — no account, nothing to install.</text>
  </g>
  <!-- Footer -->
  <g transform="translate(0, 680)">
    <text x="20" y="30" fill="#A6A6AA" font-family="Space Grotesk" font-size="10">Free for up to 9 players. No card, nothing to install.</text>
    <text x="196.5" y="50" fill="#A6A6AA" font-family="Space Grotesk" font-size="10" text-anchor="middle">Runs in any browser today</text>
    <text x="196.5" y="70" fill="#A6A6AA" font-family="Space Grotesk" font-size="10" text-anchor="middle">Host, player and TV views all open from a link — nothing to download.</text>
    <g transform="translate(0, 90)">
      <circle cx="40" cy="10" r="8" fill="#D53032"/><text x="56" y="18" fill="#FFFFFF" font-family="Space Grotesk" font-size="9">App Store</text>
      <circle cx="333" cy="10" r="8" fill="#D53032"/><text x="349" y="18" fill="#FFFFFF" font-family="Space Grotesk" font-size="9">Play Console</text>
    </g>
  </g>
</svg>